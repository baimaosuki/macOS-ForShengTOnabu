schema_version = 2

[board]
name = "nabu"
soc = "SM8150"
soc_source = "sm8150"
os_profile = "macos-27.3-26C5035r"
kit = "nabu"
description = "Xiaomi Pad 5; fresh SHENG macOS 27.3 adaptation, CPU display and software PAC"
# SM8150 has no FEAT_PAuth. The OS identity and all OS patches remain 27.3;
# the board supplies its explicit no-PAuth architecture series below.
arch = "arm64"

[components]
include = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "DarwinBoot", "RamBlock", "GopFramebuffer", "AppleKeyStoreState", "SoftwareAES", "ShengUfs"]

[kernel]
defconfig = "nabu_macos27_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8150.config", "os:configs/macos.config"]
patch_series = ["device:patches/xnu/architecture.series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]
archives = ["build-corecrypto-14.py", "build-corecrypto-14.py --namespace", "component:ArmDTPlatform", "component:ArmCpu", "build-libpthread-kernel.py", "component:ShengUfs", "component:RamBlock", "component:AppleKeyStoreState", "component:SoftwareAES", "component:GopFramebuffer", "build-nabu-display27.py"]

[device_tree]
source = "device:dts/nabu.dts"
include_dirs = ["soc:dts"]

[payload]
volume = "NABUESP"
size_mib = 208
loader = "firmware"
title = "macOS 27.3"
timeout = -1
panic_screen = true
root_policies = "{tree}/build/sheng-source-storage/root-policies.bin"
kernel_args = ["debug=0x14e", "kt_fixed_zones=120", "-no_slto_panic", "use_contiguous_hint=0", "native-source-storage=1", "native-ufs-root=1", "apfs-boot-shim=1", "vc-text=1", "exec-log=1", "timebase-hz=24000000", "offline-mobile-graphics-load=1", "offline-mobile-graphics-client=1", "offline-legacy-register=1", "offline-legacy-gop=1", "offline-legacy-pm=1", "offline-legacy-validate=1", "offline-legacy-transfer=1", "offline-legacy-cpu-present=1", "offline-legacy-phase=4", "vsync=60", "aks=1", "aks-sls=3", "smp=1", "armcpu-edge=1", "log=1", "disable-watchdogd=1", "offline-key-events=1"]

[payload.adt]
chip_id = "6050"
owned_memory_size = "0x100000000"
owned_memory_excluded_ranges = 64
loader_inputs = true
packed_data_ramdisk = true
unique_chip_id = "required"

[payload.runtime]
tool = "scripts/build-boot-runtime.py"
target = "macos27"
build = "26C5035r"
data_seed_tool = "scripts/make-macos-data-seed.py"
data_gib = 8
skip_setup = true
boot_shims = true
gpu_addon = false
trust_components = ["StaticTrustCache", "Cryptex1,SystemTrustCache", "Cryptex1,AppTrustCache"]

[package]
unixnu = "../.."

[package.defconfig]
"macos-27.3-26C5035r" = "nabu_macos27_defconfig"

[adt.defaults.u32]
sleep-disabled = 1
vmm-present = 1
# Same upstream sizing rule: owned memory/64 KiB + 1024.
"kern.maxvnodes" = 66560

[adt.chosen.u32]
kernel-ctrr-to-be-enabled = 0
