schema_version = 2

[board]
name = "nabu"
soc = "SM8150"
soc_source = "sm8150"
os_profile = "macos-27.3-26C5035r"
kit = "nabu"
description = "Xiaomi Pad 5; fresh SHENG macOS 27.3 adaptation, CPU display and zeta ordinary-pointer PAC ABI"
# SM8150 has no FEAT_PAuth. The OS identity and all OS patches remain 27.3;
# the board supplies its explicit no-PAuth architecture series below.
arch = "arm64"

[components]
include = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "DarwinBoot", "RamBlock", "GopFramebuffer", "AppleKeyStoreState", "SoftwareAES", "ShengUfs"]

# USB2, NT36523 and PM8150 are board archives built by build-nabu-input27.py.
[kernel]
defconfig = "nabu_macos27_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8150.config", "os:configs/macos.config"]
patch_series = ["device:patches/xnu/architecture.series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]
archives = ["build-corecrypto-14.py", "build-corecrypto-14.py --namespace", "component:ArmDTPlatform", "component:ArmCpu", "build-libpthread-kernel.py", "component:ShengUfs", "component:RamBlock", "component:AppleKeyStoreState", "component:SoftwareAES", "component:GopFramebuffer", "build-nabu-display27.py"]

[kernel.prelink]
tool = "scripts/prelink-nabu-arm64.py"

[device_tree]
source = "device:dts/nabu.dts"
include_dirs = ["soc:dts"]

[payload]
volume = "NABUESP"
size_mib = 208
loader = "firmware"
title = "macOS 27.3"
timeout = -1
panic_screen = true
root_policies = "{tree}/build/sheng-source-storage/root-policies.bin"
text_fixups = [
    "dyld_shared_cache_arm64e.03,5b51d00,7f2303d5f44fbea9,000080d2c0035fd6",
    "dyld_shared_cache_arm64e.03,5b4263c,7f2303d5f657bda9,000080d2c0035fd6",
    "dyld_shared_cache_arm64e.03,5de63cc,1811981a,f803082a",
    "dyld_shared_cache_arm64e.01,24dfd5c,ff4302d1f65706a9,ff2303d5c0035fd6",
    "dyld_shared_cache_arm64e.01,26cde70,f40300aa,140a80d2",
    "dyld_shared_cache_arm64e.03,28bb658,ce674e95,00008052",
    "dyld_shared_cache_arm64e.03,6cf7304,fb214094,00008052",
    "dyld_shared_cache_arm64e.03,239d0ec,a1ab6595,00008052",
    "dyld_shared_cache_arm64e.03,5c3685c,a00180524039a672010080d2020080d2,68ca42f9c800e037e00313aa010080d2",
    "dyld_shared_cache_arm64e.03,5c3686c,030080d2040080d28ffd8294,e1a5ff971f2003d51f2003d5",
]
# CPU display registration has its own offline-legacy-register switch. The
# optional offline-mobile-graphics-client diagnostic calls the legacy five-arg
# externalMethod on an unattached IOUserClient2022, whose implementation panics.
# Keep that diagnostic off so BSD startup can reach IOKitBSDInit normally.
kernel_args = ["debug=0x14e", "kt_fixed_zones=120", "-no_slto_panic", "use_contiguous_hint=0", "native-source-storage=1", "native-ufs-root=1", "apfs-boot-shim=1", "vc-text=1", "exec-log=1", "timebase-hz=24000000", "offline-mobile-graphics-load=1", "offline-legacy-register=1", "offline-legacy-gop=1", "offline-legacy-pm=1", "offline-legacy-validate=1", "offline-legacy-transfer=1", "offline-legacy-cpu-present=1", "offline-legacy-phase=4", "vsync=60", "aks=1", "aks-sls=3", "smp=1", "armcpu-edge=1", "log=1", "nabu-log=1", "nabu-log-token=cfef620840c9cd33251ee67608ca318d", "disable-watchdogd=1", "no-lc=1", "offline-key-events=1", "nabu-touch=1", "nabu-usb-host=1", "nabu-power-key=1", "ethernet=1", "data-persist=2", "nabu-session-observer=1"]

[payload.adt]
# Data lives on UFS (data-persist=2), not in the installation RAM-disk seed.
# Marking it ephemeral makes native usermanagerd skip UMDPersonaManager setup.
persistent_data = true
chip_id = "6050"
owned_memory_size = "0x100000000"
owned_memory_excluded_ranges = 64
loader_inputs = true
packed_data_ramdisk = true
unique_chip_id = "required"

[payload.runtime]
tool = "scripts/build-boot-runtime.py"
target = "macos27"
build = "26C5035r"
data_seed_tool = "scripts/make-macos-data-seed.py"
data_gib = 8
skip_setup = true
boot_shims = true
# The no-PAuth loader accepts Apple's arm64e ABI v0, while Xcode emits
# preview ABI v1 for -target arm64e. Owner C tools use the stable arm64 ABI.
boot_tool_arch = "arm64"
gpu_addon = false
trust_components = ["StaticTrustCache", "Cryptex1,SystemTrustCache", "Cryptex1,AppTrustCache"]

[payload.install]
title = "Initialize macOS Data and boot"
confirm = "Erase macOS Data and initialize it from the new 27.3 installation seed?"
confirm_titles = ["Initialize Data and boot"]
confirm_args = ["data-reset=1"]

[package]
unixnu = "../.."

[package.defconfig]
"macos-27.3-26C5035r" = "nabu_macos27_defconfig"

[firmware]
config = "nabu"
dsc = "Platforms/Xiaomi/nabuPkg/nabu.dsc"
fd = "Build/nabuPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = ["scripts/import-nabu-uefi.py"]
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = ["{uefi}", "{uefi}/Platforms/Xiaomi", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}", "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample", "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium", "{uefi}/Silicium-ACPI", "{uefi}/Silicium-ACPI/Platforms/Xiaomi", "{uefi}/Silicium-ACPI/Silicon/Qualcomm"]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "nabu"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "nabu27-fresh"

[bootimg]
max_image_bytes = 202375168

[bootimg.image]
ramdisk_compression = "uefi-chunks"

[adt.defaults.u32]
sleep-disabled = 1
vmm-present = 1
# Same upstream sizing rule: owned memory/64 KiB + 1024.
"kern.maxvnodes" = 66560

[adt.chosen.u32]
kernel-ctrr-to-be-enabled = 0

[userdata]
partition = "macosroot"
# Preserved GPT geometry; this recipe only produces a host-side image.
first_lba = 2752576
last_lba = 30660602
lba_bytes = 4096
