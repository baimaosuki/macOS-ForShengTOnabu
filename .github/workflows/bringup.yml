name: NABU fresh macOS 27.3
on:
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        options: [native, runtime, boot-tools]
        default: native
permissions:
  contents: read
concurrency:
  group: nabu27-${{ inputs.stage || 'native' }}
  cancel-in-progress: false
jobs:
  boot-tools:
    if: inputs.stage == 'boot-tools'
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require Intel host and report SDK
        run: |
          test "$(uname -m)" = x86_64
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Build and verify signed standard arm64 boot tools
        run: python3 devices/nabu/scripts/build-boot-tools.py --output out/nabu27-boot-tools
      - uses: actions/upload-artifact@v4
        with:
          name: nabu27-boot-tools
          path: out/nabu27-boot-tools/
  compile:
    if: inputs.stage != 'runtime' && inputs.stage != 'boot-tools'
    runs-on: macos-26-intel
    timeout-minutes: 180
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require Intel host and report SDKs
        run: |
          test "$(uname -m)" = x86_64
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk macosx --show-sdk-version
      - name: Install upstream build tools
        run: brew install cmake ninja unifdef llvm lld dtc
      - name: Select the fresh NABU profile
        run: ./unixnu defconfig nabu_macos27_defconfig -D devices/nabu --os macos-27
      - uses: actions/cache/restore@v4
        id: kernel-cache
        with:
          key: nabu27-native-v1-${{ runner.arch }}-${{ hashFiles('patches/**', 'profiles/**', 'devices/nabu/patches/**', 'devices/nabu/compat/pac/**', 'devices/nabu/configs/**', 'soc/sm8150/patches/**') }}-${{ github.sha }}
          restore-keys: nabu27-native-v1-${{ runner.arch }}-
          path: |
            out/feeds/
            out/nabu/**/xnu-inputs.json
            out/nabu/**/tree/.cache/xnu-work/
            out/nabu/**/tree/.cache/fakeroot/
            out/nabu/**/tree/build/xnu/
      - name: Compile upstream kernel and all fresh NABU source drivers
        run: python3 devices/nabu/scripts/compile-bootstrap.py --full
      - uses: actions/cache/save@v4
        if: always() && steps.kernel-cache.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.kernel-cache.outputs.cache-primary-key }}
          path: |
            out/feeds/
            out/nabu/**/xnu-inputs.json
            out/nabu/**/tree/.cache/xnu-work/
            out/nabu/**/tree/.cache/fakeroot/
            out/nabu/**/tree/build/xnu/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nabu27-native
          path: |
            out/nabu/**/logs/
            out/nabu/**/bootstrap-verification.json
            out/nabu/**/native-verification.json
            out/nabu/**/esp-log-verification/*.log
            out/nabu/**/esp-log-verification/verification.json
            out/nabu/**/lockdown-public-verification/verification.json
            out/nabu/**/lockdown-public-verification/handler.log
            out/nabu/**/tree/build/**/report.json
            out/nabu/**/tree/build/**/build-report.json
            out/nabu/**/tree/build/**/qualification.json
            out/nabu/**/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf
            out/nabu/**/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped
            out/nabu/**/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/osfmk/DEVELOPMENT/nabu_v82_emul.o*
          if-no-files-found: warn
          retention-days: 14
  runtime:
    if: inputs.stage == 'runtime'
    runs-on: macos-26-intel
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require Intel host and prepare runtime tools
        run: |
          test "$(uname -m)" = x86_64
          python3 devices/nabu/scripts/install-runtime-tools.py
          python3 -m pip install cryptography
      - name: Select the fresh profile and prepare packed seed tools
        run: |
          git submodule update --init -- drivers/DarwinBoot
          ./unixnu defconfig nabu_macos27_defconfig -D devices/nabu --os macos-27
      - name: Build new Data and signed upstream boot shims
        run: python3 devices/nabu/scripts/build-fresh-runtime.py
      - uses: actions/upload-artifact@v4
        with:
          name: nabu27-runtime-encrypted
          path: |
            out/fresh-runtime/runtime.enc
            out/fresh-runtime/runtime-envelope.json
          if-no-files-found: error
          retention-days: 14
