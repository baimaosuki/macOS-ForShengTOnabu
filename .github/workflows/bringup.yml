name: NABU fresh macOS 27.3
on:
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        options: [native, runtime, boot-tools, gpu-userspace]
        default: native
permissions:
  contents: read
concurrency:
  group: nabu27-${{ inputs.stage || 'native' }}
  cancel-in-progress: false
jobs:
  boot-tools:
    if: inputs.stage == 'boot-tools' || inputs.stage == 'native'
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require Intel host and report SDK
        run: |
          test "$(uname -m)" = x86_64
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          test "$(xcrun --sdk macosx --show-sdk-version)" = 26.5
      - name: Build and verify signed standard arm64 boot tools
        run: python3 devices/nabu/scripts/build-boot-tools.py --output out/nabu27-boot-tools
      - uses: actions/upload-artifact@v4
        with:
          name: nabu27-boot-tools
          path: out/nabu27-boot-tools/
  compile:
    if: inputs.stage == 'native' || inputs.stage == ''
    runs-on: macos-26-intel
    timeout-minutes: 180
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require Intel host and report SDKs
        run: |
          test "$(uname -m)" = x86_64
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = 26.5
          xcrun --sdk macosx --show-sdk-version
          test "$(xcrun --sdk macosx --show-sdk-version)" = 26.5
      - name: Install upstream build tools
        run: |
          brew install cmake ninja unifdef llvm lld dtc
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          python3 -m pip install numpy==2.2.6 capstone==5.0.7 unicorn==2.1.4
      - name: Select the fresh NABU profile
        run: ./unixnu defconfig nabu_macos27_defconfig -D devices/nabu --os macos-27
      - uses: actions/cache/restore@v4
        id: kernel-cache
        with:
          key: nabu27-native-v1-${{ runner.arch }}-${{ hashFiles('patches/**', 'profiles/**', 'devices/nabu/patches/**', 'devices/nabu/compat/pac/**', 'devices/nabu/configs/**', 'soc/sm8150/patches/**') }}-${{ github.sha }}
          restore-keys: nabu27-native-v1-${{ runner.arch }}-
          path: |
            out/feeds/
            out/nabu/**/xnu-inputs.json
            out/nabu/**/tree/.cache/xnu-work/
            out/nabu/**/tree/.cache/fakeroot/
            out/nabu/**/tree/build/xnu/
      - name: Compile upstream kernel and all fresh NABU source drivers
        run: python3 devices/nabu/scripts/compile-bootstrap.py --full
      - uses: actions/cache/save@v4
        if: always() && steps.kernel-cache.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.kernel-cache.outputs.cache-primary-key }}
          path: |
            out/feeds/
            out/nabu/**/xnu-inputs.json
            out/nabu/**/tree/.cache/xnu-work/
            out/nabu/**/tree/.cache/fakeroot/
            out/nabu/**/tree/build/xnu/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nabu27-native
          path: |
            out/nabu/**/logs/
            out/nabu/**/bootstrap-verification.json
            out/nabu/**/native-verification.json
            out/nabu/**/a640-ring-verification.json
            out/nabu/**/gpu-text-mode-verification/
            out/nabu/**/gpu-audit-verification/
            out/nabu/**/gpu-startup-verification/
            out/nabu/**/gpu-startup-native.json
            out/nabu27-gpu-smmu-host/verification.json
            out/nabu27-gpu-smmu-host/run.log
            out/nabu27-gpu-profile-host/verification.json
            out/nabu27-gpu-wire-host/
            out/nabu27-gpu-bo-host/
            out/nabu27-gpu-cache-host/
            out/nabu27-gpu-page-policy-host/
            out/nabu27-gpu-ownership-host/
            out/nabu27-gpu-fault-host/
            out/nabu27-gpu-view-cache-host/
            out/nabu27-touch-events-host/
            out/nabu27-gpu-handoff-host/
            out/nabu/**/zeta-pac-verification/verification.json
            out/nabu/**/esp-log-verification/*.log
            out/nabu/**/esp-log-verification/verification.json
            out/nabu/**/lockdown-public-verification/verification.json
            out/nabu/**/lockdown-public-verification/handler.log
            out/nabu/**/windowserver-abort-verification/verification.json
            out/nabu/**/windowserver-abort-verification/selection.log
            out/nabu/**/tree/build/**/report.json
            out/nabu/**/tree/build/**/build-report.json
            out/nabu/**/tree/build/**/qualification.json
            out/nabu/**/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf
            out/nabu/**/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped
            out/nabu/**/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/osfmk/DEVELOPMENT/nabu_v82_emul.o*
          if-no-files-found: warn
          retention-days: 14
  runtime:
    if: inputs.stage == 'runtime'
    runs-on: macos-26-intel
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require Intel host and prepare runtime tools
        run: |
          test "$(uname -m)" = x86_64
          python3 devices/nabu/scripts/install-runtime-tools.py
          python3 -m pip install cryptography
      - name: Select the fresh profile and prepare packed seed tools
        run: |
          git submodule update --init -- drivers/DarwinBoot
          ./unixnu defconfig nabu_macos27_defconfig -D devices/nabu --os macos-27
      - name: Build new Data and signed upstream boot shims
        run: python3 devices/nabu/scripts/build-fresh-runtime.py
      - uses: actions/upload-artifact@v4
        with:
          name: nabu27-runtime-encrypted
          path: |
            out/fresh-runtime/runtime.enc
            out/fresh-runtime/runtime-envelope.json
          if-no-files-found: error
          retention-days: 14
  gpu-userspace:
    if: inputs.stage == 'gpu-userspace'
    runs-on: macos-26-intel
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Select SDK 26.5 and install public build tools
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          test "$(xcrun --sdk macosx --show-sdk-version)" = 26.5
          brew install llvm ninja bison glslang shaderc rustup
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix rustup)/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          python3 -m pip install capstone==5.0.7
      - uses: actions/cache/restore@v4
        id: gpu-cargo-cache
        with:
          key: nabu27-m2v-cargo-v2-${{ runner.arch }}-${{ github.sha }}
          restore-keys: nabu27-m2v-cargo-v2-${{ runner.arch }}-
          path: |
            ~/.cargo/registry
            .ci-cache/nabu27-m2v-target
            .ci-cache/nabu27-m2v-prebuilt
      - name: Prepare pinned sources and verify ordinary arm64 CPU policy
        run: python3 devices/nabu/scripts/build-nabu-m2v27.py --phase prepare --output out/nabu27-gpu-userspace
      - name: Compile Turnip for macOS 27 arm64
        run: python3 devices/nabu/scripts/build-nabu-m2v27.py --phase turnip --output out/nabu27-gpu-userspace
      - name: Compile Rust M2V with parallel ThinLTO
        run: python3 devices/nabu/scripts/build-nabu-m2v27.py --phase bridge --output out/nabu27-gpu-userspace
      - name: Link and 4K-sign Metal plugin and Shader Cache app
        run: python3 devices/nabu/scripts/build-nabu-m2v27.py --phase plugin --output out/nabu27-gpu-userspace
      - name: Verify signed binaries and reject unsupported PAuth instructions
        run: python3 devices/nabu/scripts/build-nabu-m2v27.py --phase verify --output out/nabu27-gpu-userspace
      - uses: actions/cache/save@v4
        if: always() && steps.gpu-cargo-cache.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.gpu-cargo-cache.outputs.cache-primary-key }}
          path: |
            ~/.cargo/registry
            .ci-cache/nabu27-m2v-target
            .ci-cache/nabu27-m2v-prebuilt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nabu27-gpu-userspace
          include-hidden-files: true
          path: |
            out/nabu27-gpu-userspace/verification.json
            out/nabu27-gpu-userspace/cpu-policy-verification.json
            out/nabu27-gpu-userspace/bridge-cache-verification.json
            out/nabu27-gpu-userspace/prepared.json
            out/nabu27-gpu-userspace/tree/nabu-runtime-inputs.json
            out/nabu27-gpu-userspace/tree/build/adreno-metal-plugin-macos27/
            out/nabu27-gpu-userspace/tree/build/adreno-metal-bridge/*.log
            out/nabu27-gpu-userspace/tree/.cache/mesa-tu-macos27-*.log
          if-no-files-found: warn
          retention-days: 14
